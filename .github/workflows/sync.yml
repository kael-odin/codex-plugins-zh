name: sync-upstream

on:
  schedule:
    - cron: '17 2 * * *' # daily 02:17 UTC = 10:17 Beijing
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write # the failure step opens/comments on its tracking issue

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch upstream
        run: git clone --depth 50 https://github.com/openai/plugins.git .upstream

      - name: Compute diff
        run: node tools/sync.mjs

      - name: Adopt seed translations (best-effort)
        run: |
          git clone --depth 1 https://cnb.cool/echobird/codex-plugins.git .seed \
            && node tools/translate.mjs --seed .seed \
            || echo "[warn] seed unavailable, continuing with committed ledger"

      - name: Translate pending via GLM (optional secret)
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          if [ -n "$GLM_API_KEY" ]; then
            node tools/translate.mjs --execute
          else
            echo "[info] GLM_API_KEY not configured, skipping API translation"
          fi

      - name: Compose publish tree
        run: node tools/compose.mjs

      - name: Verify lossless (gate)
        run: node tools/verify.mjs

      # The site build asserts the datasets are non-empty, resolves every plugin
      # icon and writes data/site-stats.json — the counts the docs are checked
      # against below. Building here means a sync that would ship a broken site
      # fails the job instead of only failing the deploy job afterwards.
      - name: Build site (asserts datasets)
        run: node tools/build-site.mjs

      - name: Check documented numbers (gate)
        run: node tools/check-docs.mjs

      - name: Commit and push
        run: |
          git config user.name "codex-plugins-zh-bot"
          git config user.email "actions@users.noreply.github.com"
          sha=$(node -p "require('./data/last-sha.json').sha.slice(0,9)")
          # Only the paths the pipeline owns. `git add -A` would also sweep up
          # anything a future tool happens to drop in the tree; .gitignore
          # covers the scratch clones, but not a typo'd output path.
          git add data i18n/zh plugins .agents
          stray=$(git status --porcelain | grep -v '^[AM] ' || true)
          if [ -n "$stray" ]; then
            echo "[warn] pipeline left untracked/unstaged paths behind:"
            echo "$stray"
          fi
          if git diff --cached --quiet; then
            echo "no changes since last sync"
          else
            git commit -m "sync: upstream ${sha} (lossless verified)"
            git push
          fi

      - name: Close stale failure issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh issue list --state open --limit 50 \
                  --search '"上游同步未通过校验" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "已恢复：$(date -u +%Y-%m-%dT%H:%MZ) 的同步通过校验并推送。"
            gh issue close "$num"
          fi

      # A silent daily job is a job nobody reads: surface the failure where it
      # gets seen, and keep one issue per streak rather than one per run.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="sync-upstream 失败：上游同步未通过校验"
          num=$(gh issue list --state open --limit 50 \
                  --search '"上游同步未通过校验" in:title' --json number --jq '.[0].number // empty')
          body=$(printf '自动同步失败。\n\n运行日志：%s\n\n修复后下一次成功运行会自动关闭本 issue。' "$RUN_URL")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
