<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="codex-plugins-zh：Codex 官方插件中文市场 — 自动同步 openai/plugins，无损汉化，每日更新">
